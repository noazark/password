name: Build and Deploy
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          lfs: "true"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install 🔧
        run: npm install

      - name: Lint 🐹
        run: npm run lint

      - name: Test 📐
        run: npm run test

      - name: Build 🏠
        run: npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
